plugins {
    id 'com.android.application'
}
android {
    namespace 'app.randomseek'
    compileSdk 34
    defaultConfig {
        applicationId 'app.randomseek'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    // Постоянный ключ в репозитории: все сборки подписаны одинаково, и новая версия ставится поверх старой.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
