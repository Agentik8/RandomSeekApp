name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: random-seek-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RandomSeek.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RandomSeek.apk --target "${{ github.sha }}" --title "Случайная перемотка (APK)" --notes "Готовый APK. Скачайте RandomSeek.apk и установите."
